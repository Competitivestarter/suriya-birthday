<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Happy Birthday 🎂</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      overflow-x: hidden;
      background: linear-gradient(135deg, #ff758c, #ff7eb3, #ffb199);
      min-height: 100vh;
      color: white;
      text-align: center;
      position: relative;
    }

    .container {
      padding: 30px 20px;
      position: relative;
      z-index: 2;
    }

    h1 {
      font-size: 3rem;
      margin-top: 20px;
      animation: glow 2s infinite alternate;
    }

    @keyframes glow {
      from {
        transform: scale(1);
      }
      to {
        transform: scale(1.08);
      }
    }

    .message {
      font-size: 1.3rem;
      margin-top: 15px;
      margin-bottom: 25px;
      line-height: 1.6;
    }

    .gallery {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 20px;
      margin-top: 25px;
    }

    .slideshow img {
      width: 280px;
      height: 280px;
      object-fit: cover;
      border-radius: 20px;
      border: 4px solid white;
      box-shadow: 0 0 15px rgba(255,255,255,0.6);
      transition: transform 0.4s;
      animation: float 4s ease-in-out infinite;
    }

    button {
      padding: 12px 20px;
      border: none;
      border-radius: 12px;
      margin: 10px;
      font-size: 16px;
      cursor: pointer;
      background: white;
      color: #ff4f81;
      font-weight: bold;
      transition: 0.3s;
    }

    button:hover {
      transform: scale(1.05);
    }

    .gallery img {
      width: 250px;
      height: 250px;
      object-fit: cover;
      border-radius: 20px;
      border: 4px solid white;
      box-shadow: 0 0 15px rgba(255,255,255,0.6);
      transition: transform 0.4s;
      animation: float 4s ease-in-out infinite;
    }

    .gallery img:hover {
      transform: scale(1.08);
    }

    @keyframes float {
      0% {
        transform: translateY(0px);
      }
      50% {
        transform: translateY(-10px);
      }
      100% {
        transform: translateY(0px);
      }
    }

    audio {
      margin-top: 20px;
      width: 300px;
    }

    .hearts {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      z-index: 1;
      pointer-events: none;
    }

    .heart {
      position: absolute;
      color: rgba(255,255,255,0.8);
      font-size: 24px;
      animation: fall linear infinite;
    }

    @keyframes fall {
      0% {
        transform: translateY(-10vh) rotate(0deg);
        opacity: 1;
      }

      100% {
        transform: translateY(110vh) rotate(360deg);
        opacity: 0;
      }
    }

    .footer {
      margin-top: 40px;
      font-size: 1.2rem;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div class="hearts"></div>

  <div class="container">

    <h1>🎂 Happy Birthday 🎉</h1>

    <div class="message">
      Dear Friend Suriya ❤️<br><br>
      Wishing you happiness, success,
      laughter and endless joy.
      May all your dreams come true ✨
    </div>

    <!-- MUSIC -->
    <audio controls autoplay loop>
      <source src="song.mp3" type="audio/mpeg">
    </audio>

    <!-- PHOTO SLIDESHOW -->
    <div class="slideshow">
      <img id="slide" src="photo1.jpg" alt="Birthday Photo">

      <div style="margin-top: 20px; font-size: 18px;">
        ✨ Our best wishes to our best friend SURIYA ✨
      </div>
    </div>

    <div class="footer">
      ❤️ From Praveen and Azhveen ❤️
    </div>

  </div>

  <script>
    const heartsContainer = document.querySelector('.hearts');

    function createHeart() {
      const heart = document.createElement('div');
      heart.classList.add('heart');
      heart.innerHTML = '💖';

      heart.style.left = Math.random() * 100 + 'vw';
      heart.style.animationDuration = (Math.random() * 3 + 3) + 's';
      heart.style.fontSize = (Math.random() * 20 + 20) + 'px';

      heartsContainer.appendChild(heart);

      setTimeout(() => {
        heart.remove();
      }, 6000);
    }

    setInterval(createHeart, 300);

    // PHOTO SLIDESHOW
    const photos = [
      '1.jpg',
      '2.jpg',
      '3.jpg',
      '4.jpg',
      '5.jpg',
      '6.jpg',
      '7.jpg',
      '8.jpg',
      '9.jpg',
      '10.jpg',
      '11.jpg',
      '12.jpg',
      '13.jpg',
      '14.jpg',
      '15.jpg',

    ];

    let currentPhoto = 0;

    function nextPhoto() {
      currentPhoto = (currentPhoto + 1) % photos.length;
      document.getElementById('slide').src = photos[currentPhoto];
    }

    function previousPhoto() {
      currentPhoto = (currentPhoto - 1 + photos.length) % photos.length;
      document.getElementById('slide').src = photos[currentPhoto];
    }

    // AUTO CHANGE EVERY 5 SECONDS
    setInterval(nextPhoto, 5000);
  </script>

</body>
</html>
